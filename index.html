<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aniversariantes | Adore Church</title><style>*{box-sizing:border-box}body{margin:0;background:#f5eee7;color:#29231e;font-family:Arial,sans-serif}.app{max-width:960px;margin:auto;padding:28px 18px}.head{text-align:center}.brand{font-weight:bold;letter-spacing:2px}.brand b{color:#e21d2b}h1{font-size:28px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-top:24px}.panel{background:#fff;padding:20px;border-radius:16px;border:1px solid #e6d8ca}label{display:block;font-weight:bold;font-size:14px;margin:0 0 8px}input[type=text]{width:100%;padding:12px;border:1px solid #d7c6b5;border-radius:9px;margin-bottom:18px;font-size:16px}.upload{background:#fcf7f2;border:1px dashed #b89563;padding:16px;border-radius:10px;margin-bottom:18px}button{width:100%;border:0;background:#29231e;color:#fff;padding:14px;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}canvas{display:block;width:100%;max-width:450px;margin:auto;box-shadow:0 10px 30px #0002}.hint,.status{font-size:12px;color:#75685c;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}.preview{max-width:380px;margin:auto}}</style></head><body><main class="app"><header class="head"><div class="brand"><b>🔥</b> ADORE CHURCH</div><h1>Gerador de aniversariantes</h1><p>Envie a foto, digite o nome e baixe a arte.</p></header><section class="layout"><div class="panel"><label for="nm">Nome do aniversariante</label><input id="nm" type="text" maxlength="70" placeholder="Digite o nome"><label for="ph">Foto do aniversariante</label><div class="upload"><input id="ph" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">Use uma foto nítida, com o rosto visível. A imagem é processada no próprio navegador.</p></div><button id="dl" disabled>Baixar arte em PNG</button></div><div class="preview"><canvas id="cv" width="900" height="1600"></canvas><p class="status" id="st">Adicione uma foto e o nome para começar.</p></div></section></main><script>const c=document.querySelector('#cv'),x=c.getContext('2d'),nm=document.querySelector('#nm'),ph=document.querySelector('#ph'),dl=document.querySelector('#dl'),st=document.querySelector('#st');let img=null;function draw(){let g=x.createLinearGradient(0,0,900,1600);g.addColorStop(0,'#f4eae1');g.addColorStop(.5,'#fffaf5');g.addColorStop(1,'#eee0d2');x.fillStyle=g;x.fillRect(0,0,900,1600);for(let i=0;i<100;i++){x.beginPath();x.arc((i*137+31)%900,(i*223+47)%1600,i%3+1,0,7);x.fillStyle='#b8956350';x.fill()}x.textAlign='center';x.fillStyle='#e21d2b';x.font='bold 48px Arial';x.fillText('♨',380,110);x.fillStyle='#181614';x.font='bold 42px Arial';x.fillText('ADORE',495,94);x.font='32px Arial';x.fillText('CHURCH',495,130);x.save();x.beginPath();x.moveTo(230,780);x.lineTo(230,420);x.arcTo(230,200,450,200,220);x.arcTo(670,200,670,420,220);x.lineTo(670,780);x.closePath();x.clip();x.fillStyle='#e5d7c9';x.fillRect(200,180,500,610);if(img){let s=Math.max(440/img.width,570/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,450-w/2,480-h/2,w,h)}else{x.fillStyle='#b09b86';x.font='28px Arial';x.fillText('SUA FOTO AQUI',450,490)}x.restore();[0,12,24].forEach((o,i)=>{x.beginPath();x.moveTo(210-o,800+o);x.lineTo(210-o,410);x.arcTo(210-o,185-o,450,185-o,240);x.arcTo(690+o,185-o,690+o,410,240);x.lineTo(690+o,800+o);x.strokeStyle=i===1?'#c5a06c':'#b28d60';x.lineWidth=3;x.stroke()});function bal(a,b,r,q,col){let z=x.createRadialGradient(a-r*.3,b-q*.3,2,a,b,r);z.addColorStop(0,'#fff8e8');z.addColorStop(.5,col);z.addColorStop(1,'#9c7b59');x.fillStyle=z;x.beginPath();x.ellipse(a,b,r,q,0,0,7);x.fill();x.beginPath();x.moveTo(a,b+q);x.quadraticCurveTo(a+10,b+q+30,a-4,b+q+50);x.strokeStyle='#b38d65';x.stroke()}bal(125,405,73,105,'#d5a081');bal(785,315,75,110,'#d8c49b');bal(135,690,65,90,'#e8ddd4');bal(770,735,72,95,'#c5a77b');x.fillStyle='#39332d';x.font='italic 92px Georgia';x.fillText('Parabéns',450,970);x.strokeStyle='#c7a35f';x.lineWidth=5;x.beginPath();x.moveTo(235,1000);x.quadraticCurveTo(450,1030,665,1000);x.stroke();let name=nm.value.trim().toLocaleUpperCase('pt-BR')||'NOME DO ANIVERSARIANTE';let fs=48;x.font='bold '+fs+'px Arial';while(x.measureText(name).width>780&&fs>25){fs-=2;x.font='bold '+fs+'px Arial'}let nw=Math.min(830,x.measureText(name).width+54);x.fillStyle='#d7c0a8';x.beginPath();x.roundRect(450-nw/2,1030,nw,76,18);x.fill();x.fillStyle='#29231e';x.fillText(name,450,1082);x.fillStyle='#a98761';x.font='26px Georgia';x.fillText('♡',450,1150);x.fillStyle='#26221f';x.font='29px Arial';x.fillText('O Senhor te abençoe e te guarde;',450,1210);x.fillText('o Senhor faça resplandecer o seu rosto',450,1255);x.fillText('sobre ti e te conceda graça; o Senhor',450,1300);x.fillText('volte para ti o seu rosto e te dê paz.',450,1345);x.strokeStyle='#b38c64';x.lineWidth=2;x.beginPath();x.roundRect(270,1390,360,54,27);x.stroke();x.fillStyle='#98714d';x.font='bold 22px Arial';x.fillText('NÚMEROS 6:24-26',450,1425);x.fillStyle='#e0cbb6';x.beginPath();x.moveTo(0,1480);x.quadraticCurveTo(200,1520,330,1600);x.lineTo(0,1600);x.fill();x.fillStyle='#c5a35f';x.beginPath();x.moveTo(900,1470);x.quadraticCurveTo(700,1510,570,1600);x.lineTo(900,1600);x.fill();dl.disabled=!(img&&nm.value.trim());st.textContent=img&&nm.value.trim()?'Arte pronta para baixar.':'Adicione uma foto e o nome para começar.'}nm.addEventListener('input',draw);ph.addEventListener('change',()=>{let f=ph.files[0];if(!f){img=null;draw();return}if(f.size>12*1024*1024){alert('A imagem deve ter até 12 MB.');ph.value='';return}let a=new Image();a.onload=()=>{img=a;draw()};a.src=URL.createObjectURL(f)});dl.addEventListener('click',()=>{let a=document.createElement('a');a.download='aniversariante.png';a.href=c.toDataURL('image/png');a.click()});draw();</script></body></html>
