<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aniversariantes | Adore Church</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5eee7;color:#29231e;font-family:Arial,sans-serif}.app{max-width:960px;margin:auto;padding:28px 18px}.head{text-align:center}.brand{font-weight:bold;letter-spacing:2px}.brand b{color:#e21d2b}h1{font-size:28px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-top:24px}.panel{background:#fff;padding:20px;border-radius:16px;border:1px solid #e6d8ca}label{display:block;font-weight:bold;font-size:14px;margin:0 0 8px}input[type=text]{width:100%;padding:12px;border:1px solid #d7c6b5;border-radius:9px;margin-bottom:18px;font-size:16px}.upload{background:#fcf7f2;border:1px dashed #b89563;padding:16px;border-radius:10px;margin-bottom:18px}button{width:100%;border:0;background:#29231e;color:#fff;padding:14px;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}canvas{display:block;width:100%;max-width:450px;margin:auto;box-shadow:0 10px 30px #0002}.hint,.status{font-size:12px;color:#75685c;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}.preview{max-width:380px;margin:auto}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div class="brand"><b>🔥</b> ADORE CHURCH</div><h1>Gerador de aniversariantes</h1><p>Envie a foto, digite o nome e baixe a arte.</p></header>
    <section class="layout">
      <div class="panel">
        <label for="nm">Nome do aniversariante</label><input id="nm" type="text" maxlength="70" placeholder="Digite o nome">
        <label for="ph">Foto do aniversariante</label>
        <div class="upload"><input id="ph" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">Use uma foto nítida, com o rosto visível. A imagem é processada no próprio navegador.</p></div>
        <button id="dl" disabled>Baixar arte em PNG</button>
      </div>
      <div class="preview"><canvas id="cv" width="900" height="1600"></canvas><p class="status" id="st">Adicione uma foto e o nome para começar.</p></div>
    </section>
  </main>
  <script>
    const c=document.querySelector('#cv'),x=c.getContext('2d'),nm=document.querySelector('#nm'),ph=document.querySelector('#ph'),dl=document.querySelector('#dl'),st=document.querySelector('#st');
    const frame=new Image(); frame.src='public/moldura-adore.jpg'; let img=null,frameReady=false;
    frame.onload=()=>{frameReady=true;draw()};
    function clipPhoto(){x.beginPath();x.moveTo(244,850);x.lineTo(244,420);x.arcTo(244,220,450,220,200);x.arcTo(656,220,656,420,200);x.lineTo(656,850);x.closePath();x.clip()}
    function clearPhotoOpening(){x.save();x.globalCompositeOperation='destination-out';x.beginPath();x.moveTo(244,850);x.lineTo(244,420);x.arcTo(244,220,450,220,200);x.arcTo(656,220,656,420,200);x.lineTo(656,850);x.closePath();x.fill();x.restore()}
    function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#f7eee8';x.fillRect(0,0,c.width,c.height);if(!frameReady)return;x.drawImage(frame,0,0,900,1600);clearPhotoOpening();x.save();clipPhoto();x.fillStyle='#f7eee8';x.fillRect(220,210,460,660);if(img){const s=Math.max(412/img.width,630/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,450-w/2,530-h/2,w,h)}x.restore();const name=nm.value.trim().toLocaleUpperCase('pt-BR')||'NOME DO ANIVERSARIANTE';let fs=39;x.font='bold '+fs+'px Arial';while(x.measureText(name).width>720&&fs>22){fs-=1;x.font='bold '+fs+'px Arial'}const nw=Math.min(790,x.measureText(name).width+46);x.fillStyle='#d8c0a7';x.beginPath();x.roundRect(450-nw/2,1105,nw,62,14);x.fill();x.fillStyle='#29231e';x.textAlign='center';x.fillText(name,450,1148);dl.disabled=!(img&&nm.value.trim());st.textContent=img&&nm.value.trim()?'Arte pronta para baixar.':'Adicione uma foto e o nome para começar.'}
    nm.addEventListener('input',draw);ph.addEventListener('change',()=>{const f=ph.files[0];if(!f){img=null;draw();return}if(f.size>12*1024*1024){alert('A imagem deve ter até 12 MB.');ph.value='';return}const a=new Image();a.onload=()=>{img=a;draw()};a.src=URL.createObjectURL(f)});dl.addEventListener('click',()=>{const a=document.createElement('a');a.download='aniversariante.png';a.href=c.toDataURL('image/png');a.click()});draw();
  </script>
</body>
</html>
